[package]
name = "iron"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iron"
path = "src/bin/iron.rs"

[dependencies]
# Core networking
iroh = "0.95"
tun = { version = "0.8", features = ["async"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Data structures
dashmap = "6"

# DNS server
hickory-server = "0.25"
hickory-proto = "0.25"
hickory-client = "0.25"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Packet parsing
etherparse = "0.19"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Encoding/decoding
data-encoding = "2"
hex = "0.4"

# Serialization
postcard = { version = "1", features = ["alloc"] }
serde_bytes = "0.11"

# Cryptography
rand = "0.9"
ed25519-dalek = "2"

# Async traits
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

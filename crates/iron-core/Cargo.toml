[package]
name = "iron-core"
version.workspace = true
edition.workspace = true

# Portable engine: every dependency here must build for all targets,
# including aarch64-linux-android (enforced by the `iron-core-android` flake
# check). OS-bound crates (tun, nix, ...) belong in a platform crate such as
# iron-desktop. See the crate docs in src/lib.rs.
[dependencies]
anyhow.workspace = true
async-trait.workspace = true
data-encoding.workspace = true
dashmap.workspace = true
etherparse.workspace = true
futures.workspace = true
hex.workspace = true
hickory-client.workspace = true
hickory-proto.workspace = true
hickory-server.workspace = true
iroh.workspace = true
postcard.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
